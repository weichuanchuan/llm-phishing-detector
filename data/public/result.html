<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --card: #f7f9fc;
            --glass: rgba(95, 139, 255, 0.08);
            --accent: #5dd4a1;
            --accent-2: #5f8bff;
            --text: #1f2a44;
            --muted: #5b6b85;
            --error: #e84f7a;
            --shadow: 0 14px 46px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 22px;
        }

        header {
            width: 100%;
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 2.6em;
            color: #1f2a44;
            letter-spacing: 0.5px;
            text-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 8px;
        }

        header p { color: var(--muted); }

        .content {
            background: var(--card);
            border-radius: 18px;
            padding: 28px;
            max-width: 1200px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid rgba(95,139,255,0.12);
        }

        .section { margin-bottom: 32px; }
        .section h2 {
            font-size: 1.6em;
            color: #1f2a44;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2 span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px rgba(124, 242, 173, 0.6);
        }

        .sender-info p {
            font-size: 1em;
            margin-bottom: 8px;
            word-wrap: break-word;
            color: var(--text);
        }

        .sender-info strong { color: #1f2a44; }

        .chart-container { width: 100%; max-width: 380px; margin: 0 auto 16px auto; position: relative; height: 320px; }

        .ai-analysis { padding: 18px; border-radius: 14px; background: var(--glass); box-shadow: inset 0 0 12px rgba(0,0,0,0.04); }

        .ai-analysis .trustworthiness {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 12px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            color: #0b1224;
            border-radius: 999px;
            font-weight: 700;
        }

        .threat {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            background: rgba(95, 139, 255, 0.05);
            border: 1px solid rgba(95, 139, 255, 0.12);
        }

        .threat.low { border-left: 5px solid #5dd4a1; }
        .threat.medium { border-left: 5px solid #f4b740; }
        .threat.high { border-left: 5px solid #e84f7a; }

        .threat-title { font-weight: 700; margin-bottom: 6px; color: #1f2a44; }
        .threat-description { color: var(--muted); line-height: 1.5; }
        .trust-points { color: #d5deed; font-style: italic; font-size: 12px; }

        .check {
            background: rgba(95, 139, 255, 0.05);
            border: 1px solid rgba(95, 139, 255, 0.12);
            border-left: 5px solid var(--accent-2);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            word-wrap: break-word;
        }

        .check.failed { border-left-color: var(--error); }
        .check .points { font-weight: 700; color: var(--accent); }
        .check.failed .points { color: var(--error); }

        .check-title { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
        .check-title strong { color: #1f2a44; flex: 1; }

        .screenshot-thumbnail {
            width: 90px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .screenshot-thumbnail:hover { transform: scale(1.05); }
        .nested-checks { margin-left: 12px; margin-top: 6px; }

        .actions { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
        .actions button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            color: #0b1224;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 14px 34px rgba(122, 184, 255, 0.25);
            transition: transform 0.2s;
        }

        .actions button:hover { transform: translateY(-1px) scale(1.01); }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content { margin: auto; display: block; max-width: 80%; max-height: 80%; border-radius: 10px; }
        .modal-close { position: absolute; top: 26px; right: 32px; color: #fff; font-size: 36px; cursor: pointer; }

        @media (max-width: 900px) {
            .check-title { flex-direction: column; align-items: flex-start; }
            .screenshot-thumbnail { margin-top: 6px; }
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2.1em; }
            .content { padding: 22px; }
            .chart-container { height: 280px; }
        }
    </style>
</head>
<body>
    <script src="feedback.js"></script>
    <header>
        <h1>分析结果</h1>
        <p>以下为本次邮件的安全评估详情</p>
    </header>
    <main class="content">
        <div class="section sender-info">
            <h2><span></span> 发件信息</h2>
            <p><strong>姓名：</strong> <span id="sender-name">-</span></p>
            <p><strong>邮箱：</strong> <span id="sender-email">-</span></p>
            <p><strong>主题：</strong> <span id="subject">-</span></p>
        </div>

        <div class="section">
            <h2><span></span> 综合评分</h2>
            <div class="chart-container">
                <canvas id="scoreChart"></canvas>
            </div>
            <p style="text-align: center; margin-top: 10px; font-size: 0.85em; color: var(--muted);">得分越高，说明邮件越可信。</p>
        </div>

        <div class="section ai-analysis">
            <h2><span></span> AI 分析</h2>
            <div id="ai-analysis-content"></div>
        </div>

        <div class="section header-analysis">
            <h2><span></span> 邮件头部检查</h2>
            <p style="margin-bottom: 14px; font-size: 0.9em; color: var(--muted);">通过验证 SPF、DKIM 以及来源路径，判断邮件是否被篡改或伪装。</p>
            <div id="header-analysis-content"></div>
        </div>

        <div class="section link-analysis">
            <h2><span></span> 链接安全</h2>
            <p style="margin-bottom: 14px; font-size: 0.9em; color: var(--muted);">检查邮件中的链接是否出现在黑名单或可疑跳转，必要时附上安全截图。</p>
            <div id="link-analysis-content"></div>
        </div>

        <div class="actions">
            <button id="download-button">下载报告</button>
            <button id="share-button">分享报告</button>
        </div>
    </main>

    <div id="screenshot-modal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const aiAnalysisContent = document.getElementById('ai-analysis-content');
            const senderName = document.getElementById('sender-name');
            const senderEmail = document.getElementById('sender-email');
            const subject = document.getElementById('subject');
            const headerAnalysisContent = document.getElementById('header-analysis-content');
            const linkAnalysisContent = document.getElementById('link-analysis-content');
            const shareButton = document.getElementById('share-button');

            const modal = document.getElementById('screenshot-modal');
            const modalImage = document.getElementById('modal-image');
            const modalClose = document.querySelector('.modal-close');

            let reportStr = "";
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('r');

            if (reportId) {
                fetch(`/persist/${reportId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            displayError(data.error.toUpperCase());
                            return;
                        }
                        reportStr = JSON.stringify(data);
                        populateSenderInfo(data);
                        populateAIAnalysis(data);
                        populateHeaderAnalysis(data.headerAnalysis);
                        populateLinkAnalysis(data.linkAnalysis);
                        createDonutChart(data.totalScore, data.maxScore);
                    })
                    .catch(err => {
                        displayError('加载报告时出错。');
                        console.error(err);
                    });
            } else {
                const localReport = localStorage.getItem('emailReport');
                if (localReport) {
                    reportStr = localReport;
                    try {
                        const data = JSON.parse(localReport);
                        populateSenderInfo(data);
                        populateAIAnalysis(data);
                        populateHeaderAnalysis(data.headerAnalysis);
                        populateLinkAnalysis(data.linkAnalysis);
                        createDonutChart(data.totalScore, data.maxScore);
                    } catch (e) {
                        displayError('加载报告时出错。');
                    }
                } else {
                    displayError('未找到报告，请先完成一次分析。');
                }
            }

            function displayError(message) {
                const content = document.querySelector('.content');
                content.innerHTML = `
                    <p style="color: ${"var(--error)"}; text-align: center; font-size: 1.2em;">${message}</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button style="
                            padding: 12px 22px;
                            background: linear-gradient(120deg, var(--accent), var(--accent-2));
                            color: #0b1224;
                            border: none;
                            border-radius: 12px;
                            cursor: pointer;
                            font-weight: 700;" onclick="window.location.href='/'">返回首页</button>
                    </div>
                `;
            }

            shareButton.addEventListener('click', () => {
                if (reportId) {
                    navigator.clipboard.writeText(window.location.href)
                        .then(() => alert('分享链接已复制。'))
                        .catch(() => alert('复制失败，请手动复制链接。'));
                    return;
                }

                fetch('/persist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: reportStr,
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.error || !data.uuid) {
                            alert('生成分享链接失败。');
                            return;
                        }
                        const shareUrl = `${window.location.origin}/result?r=${data.uuid}`;
                        navigator.clipboard.writeText(shareUrl)
                            .then(() => alert('分享链接已复制。'))
                            .catch(() => alert(`分享链接：${shareUrl}`));
                    })
                    .catch(() => alert('生成分享链接失败。'));
            });

            document.getElementById('download-button').addEventListener('click', () => {
                const blob = new Blob([reportStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mailcheck-report.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            modalClose.addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

            function populateSenderInfo(data) {
                senderName.textContent = data.senderName || '-';
                senderEmail.textContent = data.senderEmail || '-';
                subject.textContent = data.subject || '-';
            }

            function populateAIAnalysis(data) {
                if (!data.llmResult) {
                    aiAnalysisContent.innerHTML = '<p>未提供 AI 分析结果。</p>';
                    return;
                }

                const trustworthiness = document.createElement('div');
                trustworthiness.classList.add('trustworthiness');
                trustworthiness.textContent = `总体可信度：${data.llmResult.trustworthiness || '未知'}`;
                aiAnalysisContent.appendChild(trustworthiness);

                const trustPoints = document.createElement('div');
                trustPoints.classList.add('trust-points');
                trustPoints.textContent = `评分：${data.llmResult.points || 0} / ${data.llmResult.maxPoints || 10}`;
                aiAnalysisContent.appendChild(trustPoints);

                const threatsContainer = document.createElement('div');
                (data.llmResult.potentialThreats || []).forEach(threat => {
                    const threatDiv = document.createElement('div');
                    threatDiv.classList.add('threat', threat.severity || 'medium');

                    const title = document.createElement('div');
                    title.classList.add('threat-title');
                    title.textContent = threat.title || '潜在风险';
                    threatDiv.appendChild(title);

                    if (threat.description) {
                        const desc = document.createElement('div');
                        desc.classList.add('threat-description');
                        desc.textContent = threat.description;
                        threatDiv.appendChild(desc);
                    }

                    threatsContainer.appendChild(threatDiv);
                });

                if (threatsContainer.children.length === 0) {
                    threatsContainer.innerHTML = '<p>未发现明显威胁。</p>';
                }

                aiAnalysisContent.appendChild(threatsContainer);

                if (Array.isArray(data.llmResult.recommendations) && data.llmResult.recommendations.length) {
                    const tips = document.createElement('ul');
                    data.llmResult.recommendations.forEach(rec => {
                        const li = document.createElement('li');
                        li.textContent = rec;
                        tips.appendChild(li);
                    });
                    aiAnalysisContent.appendChild(tips);
                }
            }

            function populateHeaderAnalysis(headerData) {
                if (!headerData || !headerData.checks || headerData.checks.length === 0) {
                    headerAnalysisContent.innerHTML = '<p>没有可展示的头部检查。</p>';
                    return;
                }

                headerData.checks.forEach(check => {
                    const checkDiv = document.createElement('div');
                    checkDiv.classList.add('check');
                    if (!check.passed) checkDiv.classList.add('failed');

                    const title = document.createElement('div');
                    title.classList.add('check-title');
                    title.innerHTML = `<strong>${sanitizeText(check.title)}</strong>`;
                    checkDiv.appendChild(title);

                    const status = document.createElement('p');
                    status.innerHTML = `<strong>状态：</strong> ${check.passed ? '通过' : '未通过'}`;
                    checkDiv.appendChild(status);

                    const points = document.createElement('p');
                    points.classList.add('points');
                    points.textContent = `${check.points || 0} 分`;
                    checkDiv.appendChild(points);

                    if (check.message) {
                        const msg = document.createElement('p');
                        msg.textContent = Array.isArray(check.message) ? check.message.join('；') : check.message;
                        checkDiv.appendChild(msg);
                    }

                    headerAnalysisContent.appendChild(checkDiv);
                });
            }

            function populateLinkAnalysis(linkData) {
                if (!linkData || !linkData.checks || linkData.checks.length === 0) {
                    linkAnalysisContent.innerHTML = '<p>没有链接分析结果。</p>';
                    return;
                }

                linkData.checks.forEach(check => {
                    const checkDiv = createLinkCheckDiv(check);
                    linkAnalysisContent.appendChild(checkDiv);
                });
            }

            function createLinkCheckDiv(check) {
                const checkContainer = document.createElement('div');
                checkContainer.classList.add('check');
                if (!check.passed) checkContainer.classList.add('failed');

                const titleDiv = document.createElement('div');
                titleDiv.classList.add('check-title');
                titleDiv.innerHTML = `<strong>${sanitizeText(check.title)}</strong>`;

                if (check.screenshot) {
                    const img = document.createElement('img');
                    img.src = `/screenshot/${check.screenshot}`;
                    img.alt = `链接截图 ${check.screenshot}`;
                    img.classList.add('screenshot-thumbnail');
                    img.addEventListener('click', () => { openModal(img.src); });
                    titleDiv.appendChild(img);
                }

                checkContainer.appendChild(titleDiv);

                const status = document.createElement('p');
                status.innerHTML = `<strong>状态：</strong> ${check.passed ? '通过' : '未通过'}`;
                checkContainer.appendChild(status);

                if (Array.isArray(check.message)) {
                    const nestedDiv = document.createElement('div');
                    nestedDiv.classList.add('nested-checks');
                    check.message.forEach(subCheck => {
                        if (typeof subCheck === 'object' && subCheck.title) {
                            nestedDiv.appendChild(createLinkCheckDiv(subCheck));
                        } else {
                            const msgP = document.createElement('p');
                            msgP.textContent = sanitizeText(subCheck);
                            nestedDiv.appendChild(msgP);
                        }
                    });
                    checkContainer.appendChild(nestedDiv);
                } else if (typeof check.message === 'string') {
                    const msgP = document.createElement('p');
                    msgP.textContent = sanitizeText(check.message);
                    checkContainer.appendChild(msgP);
                }

                return checkContainer;
            }

            function createDonutChart(totalScore, maxScore) {
                totalScore = Math.max(0, Math.min(totalScore, maxScore));
                const canvas = document.getElementById('scoreChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const redColor = [255, 123, 156];
                const yellowColor = [255, 212, 143];
                const greenColor = [124, 242, 173];
                const interpolateColor = (c1, c2, f) => c1.map((c, i) => Math.round(c + f * (c2[i] - c)));
                const dynamicColorArray = totalScore <= 5 ? interpolateColor(redColor, yellowColor, totalScore / 5)
                    : interpolateColor(yellowColor, greenColor, (totalScore - 5) / 5);
                const dynamicColor = `rgb(${dynamicColorArray.join(',')})`;

                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [totalScore, maxScore - totalScore],
                            backgroundColor: [dynamicColor, 'rgba(255,255,255,0.12)'],
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { enabled: false },
                            title: {
                                display: true,
                                text: `${totalScore} / ${maxScore}`,
                                color: '#fff',
                                font: { size: 18 }
                            }
                        },
                        cutout: '55%'
                    }
                });
            }

            function sanitizeText(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function openModal(src) {
                modal.style.display = 'block';
                modalImage.src = src;
            }
        });
    </script>
</body>
</html>
