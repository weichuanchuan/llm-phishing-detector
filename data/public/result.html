<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析结果</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fef3c7, #ffe5f1, #dbeafe);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 22px;
        }
        header { width: 100%; text-align: center; margin-bottom: 26px; }
        header h1 { font-size: 2.4em; margin-bottom: 8px; color: #111827; text-shadow: 0 6px 16px rgba(168, 85, 247, 0.2); }
        header p { font-size: 1.05em; color: #4b5563; }
        .content {
            background: rgba(255,255,255,0.9);
            border-radius: 18px;
            padding: 30px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 18px 45px rgba(17, 24, 39, 0.12);
            border: 1px solid rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
        }
        .section { margin-bottom: 32px; }
        .section h2 { font-size: 1.6em; margin-bottom: 14px; color: #7c3aed; border-bottom: 2px solid #a855f7; padding-bottom: 6px; }
        .section p.meta { margin-bottom: 18px; font-size: 0.9em; color: #6b7280; }
        .sender-info p { font-size: 1em; margin-bottom: 8px; word-wrap: break-word; }
        .sender-info strong { color: #0f172a; }
        .chart-container { width: 100%; max-width: 420px; margin: 0 auto 20px auto; position: relative; height: 320px; }
        .ai-analysis { border-radius: 12px; padding: 24px; box-shadow: inset 0 0 0 1px rgba(168, 85, 247, 0.18); background: #fdf2f8; }
        .ai-analysis .trustworthiness { font-weight: 700; margin-bottom: 14px; display: inline-block; padding: 6px 12px; border-radius: 10px; background: #ede9fe; color: #6d28d9; }
        .threat { padding: 14px; border-radius: 10px; margin-bottom: 12px; background: #f8fafc; border-left: 6px solid; }
        .threat.low { border-left-color: #22c55e; background: #ecfdf3; }
        .threat.medium { border-left-color: #f97316; background: #fff7ed; }
        .threat.high { border-left-color: #ef4444; background: #fef2f2; }
        .threat-title { font-weight: 700; margin-bottom: 6px; color: #0f172a; }
        .threat-description { font-size: 0.95em; color: #4b5563; }
        .trust-points { color: #6b7280; font-style: italic; font-size: 12px; }
        .header-analysis .check, .link-analysis .check { background: #f8fafc; border-left: 6px solid #22d3ee; padding: 18px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; word-wrap: break-word; }
        .header-analysis .check.failed, .link-analysis .check.failed { border-left-color: #ef4444; background: #fff1f2; }
        .header-analysis .check .details, .link-analysis .check .details { flex: 1; word-break: break-word; }
        .header-analysis .check .points, .link-analysis .check .points { font-weight: 700; color: #a855f7; margin-left: 12px; }
        .header-analysis .check.failed .points, .link-analysis .check.failed .points { color: #ef4444; }
        .link-analysis .check { flex-direction: column; align-items: flex-start; }
        .link-analysis .check-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; width: 100%; gap: 8px; }
        .link-analysis .check-title strong { color: #0f172a; flex: 1; }
        .link-analysis .screenshot-thumbnail { width: 100px; height: 70px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 8px 18px rgba(0,0,0,0.12); }
        .link-analysis .screenshot-thumbnail:hover { transform: translateY(-2px) scale(1.02); }
        .nested-checks { margin-left: 12px; margin-top: 8px; display: grid; gap: 10px; }
        #download-button, #share-button { padding: 14px 24px; background: linear-gradient(90deg, #22d3ee, #a855f7); border: none; border-radius: 12px; color: #fff; font-size: 1em; cursor: pointer; transition: transform 0.2s, box-shadow 0.3s; box-shadow: 0 12px 24px rgba(168, 85, 247, 0.25); }
        #download-button:hover, #share-button:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(34, 211, 238, 0.25); }
        .modal { display: none; position: fixed; z-index: 1000; padding-top: 60px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0, 0, 0, 0.7); }
        .modal-content { margin: auto; display: block; max-width: 82%; max-height: 82%; border-radius: 12px; }
        .modal-close { position: absolute; top: 26px; right: 32px; color: #fff; font-size: 38px; font-weight: bold; cursor: pointer; }
        .modal-close:hover { color: #d1d5db; }
        @media (max-width: 780px) {
            .chart-container { max-width: 320px; height: 280px; }
            .header-analysis .check, .link-analysis .check { flex-direction: column; align-items: flex-start; }
            .header-analysis .check .points, .link-analysis .check .points { margin-left: 0; margin-top: 8px; }
            .link-analysis .screenshot-thumbnail { width: 70px; height: 50px; }
        }
    </style>
</head>
<body>
    <script src="feedback.js"></script>
    <header>
        <h1>分析结果</h1>
        <p>以下是针对您邮件的安全体检</p>
    </header>
    <main class="content">
        <div class="section sender-info">
            <h2>发件人信息</h2>
            <p><strong>名称：</strong> <span id="sender-name">-</span></p>
            <p><strong>邮箱：</strong> <span id="sender-email">-</span></p>
            <p><strong>主题：</strong> <span id="subject">-</span></p>
        </div>

        <div class="section">
            <h2>总评分</h2>
            <div class="chart-container">
                <canvas id="scoreChart"></canvas>
            </div>
            <p style="text-align: center; margin-top: 10px; font-size: 0.8em; color: #6b7280;">分数越高代表越安全。</p>
        </div>

        <div class="section ai-analysis">
            <div id="ai-analysis-content"></div>
        </div>

        <div class="section header-analysis">
            <h2>邮件头分析</h2>
            <p class="meta">通过 SPF/DKIM/DMARC 等信任链验证发件人，检查是否有伪造或篡改迹象。</p>
            <div id="header-analysis-content"></div>
        </div>

        <div class="section link-analysis">
            <h2>链接与页面分析</h2>
            <p class="meta">检测邮件中的链接是否命中黑白名单，并提供截图以便人工确认。</p>
            <div id="link-analysis-content"></div>
        </div>

        <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
            <button id="download-button">下载报告</button>
            <button id="share-button">分享报告链接</button>
        </div>
    </main>

    <div id="screenshot-modal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const aiAnalysisContent = document.getElementById('ai-analysis-content');
            const senderName = document.getElementById('sender-name');
            const senderEmail = document.getElementById('sender-email');
            const subject = document.getElementById('subject');
            const headerAnalysisContent = document.getElementById('header-analysis-content');
            const linkAnalysisContent = document.getElementById('link-analysis-content');
            const shareButton = document.getElementById('share-button');
            const modal = document.getElementById('screenshot-modal');
            const modalImage = document.getElementById('modal-image');
            const modalClose = document.querySelector('.modal-close');
            let reportStr = "";
            const urlParams = new URLSearchParams(window.location.search);
            const reportId = urlParams.get('r');

            if (reportId) {
                fetch(`/persist/${reportId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            displayError(data.error);
                            return;
                        }
                        reportStr = JSON.stringify(data);
                        populateSenderInfo(data);
                        populateAIAnalysis(data);
                        populateHeaderAnalysis(data.headerAnalysis);
                        populateLinkAnalysis(data.linkAnalysis);
                        createDonutChart(data.totalScore, data.maxScore);
                    })
                    .catch(err => {
                        displayError('加载报告时出现问题。');
                        console.error(err);
                    });
            } else {
                const localReport = localStorage.getItem('emailReport');
                if (localReport) {
                    reportStr = localReport;
                    try {
                        const data = JSON.parse(localReport);
                        populateSenderInfo(data);
                        populateAIAnalysis(data);
                        populateHeaderAnalysis(data.headerAnalysis);
                        populateLinkAnalysis(data.linkAnalysis);
                        createDonutChart(data.totalScore, data.maxScore);
                    } catch (e) {
                        displayError('读取本地报告失败。');
                    }
                } else {
                    displayError('未找到报告，请返回首页重新分析。');
                }
            }

            function displayError(message) {
                const content = document.querySelector('.content');
                content.innerHTML = `
                    <p style="color: #ef4444; text-align: center; font-size: 1.2em;">${message}</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button style="padding: 10px 20px; background: linear-gradient(90deg, #22d3ee, #a855f7); color: #fff; border: none; border-radius: 10px; cursor: pointer;" onclick="window.location.href='/'">返回首页</button>
                    </div>
                `;
            }

            shareButton.addEventListener('click', () => {
                if (reportId) {
                    navigator.clipboard.writeText(window.location.href).then(() => alert('已复制分享链接。'));
                    return;
                }

                fetch('/persist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: reportStr
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            alert('保存报告失败：' + data.error);
                            return;
                        }
                        const shareUrl = `${window.location.origin}/result?r=${data.uuid}`;
                        navigator.clipboard.writeText(shareUrl).then(() => alert('已复制分享链接。'));
                    })
                    .catch(err => {
                        alert('保存报告失败。');
                        console.error(err);
                    });
            });

            const downloadButton = document.getElementById('download-button');
            downloadButton.addEventListener('click', () => {
                const blob = new Blob([reportStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'email_report.json';
                a.click();
                URL.revokeObjectURL(url);
            });

            modalClose.onclick = () => { modal.style.display = 'none'; };
            window.onclick = event => { if (event.target === modal) modal.style.display = 'none'; };

            function openModal(src) {
                modal.style.display = 'block';
                modalImage.src = src;
            }

            function sanitizeText(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function populateSenderInfo(data) {
                senderName.textContent = data.senderName || '-';
                senderEmail.textContent = data.senderEmail || '-';
                subject.textContent = data.subject || '-';
            }

            function populateAIAnalysis(data) {
                if (!data.aiAnalysis) {
                    aiAnalysisContent.innerHTML = '<p>未收到 AI 分析结果。</p>';
                    return;
                }
                const analysis = data.aiAnalysis;
                const trust = document.createElement('div');
                trust.classList.add('trustworthiness');
                trust.textContent = `可信度：${analysis.trustworthiness || '未知'}`;
                aiAnalysisContent.appendChild(trust);

                if (analysis.trust_points && analysis.trust_points.length) {
                    const list = document.createElement('div');
                    analysis.trust_points.forEach(point => {
                        const item = document.createElement('div');
                        item.classList.add('trust-points');
                        item.textContent = point;
                        list.appendChild(item);
                    });
                    aiAnalysisContent.appendChild(list);
                }

                if (analysis.threats && analysis.threats.length) {
                    analysis.threats.forEach(threat => {
                        const threatDiv = document.createElement('div');
                        threatDiv.classList.add('threat');
                        threatDiv.classList.add(threat.level || 'medium');

                        const title = document.createElement('div');
                        title.classList.add('threat-title');
                        title.textContent = threat.title || '潜在风险';
                        threatDiv.appendChild(title);

                        const desc = document.createElement('div');
                        desc.classList.add('threat-description');
                        desc.textContent = threat.description || '';
                        threatDiv.appendChild(desc);

                        aiAnalysisContent.appendChild(threatDiv);
                    });
                }
            }

            function populateHeaderAnalysis(headerData) {
                if (!headerData || !headerData.checks || headerData.checks.length === 0) {
                    headerAnalysisContent.innerHTML = '<p>没有可显示的邮件头检查结果。</p>';
                    return;
                }

                headerData.checks.forEach(check => {
                    const checkDiv = document.createElement('div');
                    checkDiv.classList.add('check');
                    if (!check.passed) {
                        checkDiv.classList.add('failed');
                    }

                    const details = document.createElement('div');
                    details.classList.add('details');
                    details.innerHTML = `<strong>${sanitizeText(check.title)}</strong><br>${sanitizeText(check.message)}`;
                    checkDiv.appendChild(details);

                    const points = document.createElement('div');
                    points.classList.add('points');
                    points.textContent = `${check.points || 0} 分`;
                    checkDiv.appendChild(points);

                    headerAnalysisContent.appendChild(checkDiv);
                });
            }

            function populateLinkAnalysis(linkData) {
                if (!linkData || !linkData.checks || linkData.checks.length === 0) {
                    linkAnalysisContent.innerHTML = '<p>没有链接分析数据。</p>';
                    return;
                }

                linkData.checks.forEach(check => {
                    const checkDiv = createLinkCheckDiv(check);
                    linkAnalysisContent.appendChild(checkDiv);
                });
            }

            function createLinkCheckDiv(check) {
                const checkContainer = document.createElement('div');
                checkContainer.classList.add('check');
                if (!check.passed) {
                    checkContainer.classList.add('failed');
                }

                const titleDiv = document.createElement('div');
                titleDiv.classList.add('check-title');
                titleDiv.innerHTML = `<strong>${sanitizeText(check.title)}</strong>`;

                if (check.screenshot) {
                    const img = document.createElement('img');
                    img.src = `/screenshot/${check.screenshot}`;
                    img.alt = `截图 ${check.screenshot}`;
                    img.classList.add('screenshot-thumbnail');
                    img.addEventListener('click', () => openModal(img.src));
                    titleDiv.appendChild(img);
                }

                checkContainer.appendChild(titleDiv);

                const status = document.createElement('p');
                status.innerHTML = `<strong>状态：</strong> ${check.passed ? '通过' : '未通过'}`;
                checkContainer.appendChild(status);

                if (Array.isArray(check.message)) {
                    const nestedDiv = document.createElement('div');
                    nestedDiv.classList.add('nested-checks');
                    check.message.forEach(subCheck => {
                        if (typeof subCheck === 'object' && subCheck.title) {
                            nestedDiv.appendChild(createLinkCheckDiv(subCheck));
                        } else {
                            const msgP = document.createElement('p');
                            msgP.textContent = sanitizeText(subCheck);
                            nestedDiv.appendChild(msgP);
                        }
                    });
                    checkContainer.appendChild(nestedDiv);
                } else if (typeof check.message === 'string') {
                    const msgP = document.createElement('p');
                    msgP.textContent = sanitizeText(check.message);
                    checkContainer.appendChild(msgP);
                }

                return checkContainer;
            }

            function createDonutChart(totalScore, maxScore) {
                totalScore = Math.max(0, Math.min(totalScore, maxScore));
                const canvas = document.getElementById('scoreChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const colors = {
                    red: [255, 179, 186],
                    yellow: [247, 247, 131],
                    green: [137, 232, 148],
                };

                const interpolateColor = (c1, c2, f) => c1.map((c, i) => Math.round(c + f * (c2[i] - c)));
                const dynamicColorArray = totalScore <= 5
                    ? interpolateColor(colors.red, colors.yellow, totalScore / 5)
                    : interpolateColor(colors.yellow, colors.green, (totalScore - 5) / 5);
                const dynamicColor = `rgb(${dynamicColorArray.join(',')})`;

                new Chart(ctx, {
                    type: 'doughnut',
                    data: { datasets: [{ data: [totalScore, maxScore - totalScore], backgroundColor: [dynamicColor, '#e5e7eb'], borderWidth: 3 }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: { enabled: false },
                            title: { display: true, text: `${totalScore} / ${maxScore}`, color: '#0f172a', font: { size: 18 } }
                        },
                        cutout: '55%'
                    }
                });
            }
        });
    </script>
</body>
</html>
