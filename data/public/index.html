<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮件安全分析</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fef3c7, #ffe5f1, #dbeafe);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2.8em;
      margin-bottom: 8px;
      color: #111827;
      text-shadow: 0 6px 16px rgba(255, 105, 180, 0.25);
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 1.15em;
      color: #4b5563;
    }

    .content {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      padding: 36px 30px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 18px 45px rgba(17, 24, 39, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }

    .content h2 {
      font-size: 1.5em;
      margin-bottom: 18px;
      color: #0f172a;
      text-align: center;
    }

    .drop-zone {
      border: 2px dashed #fb7185;
      border-radius: 14px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      background: rgba(255, 255, 255, 0.75);
      color: #6b7280;
      position: relative;
    }

    .drop-zone.hover {
      background: #fff1f2;
      border-color: #f43f5e;
      color: #111827;
      transform: translateY(-2px);
    }

    .drop-zone input { display: none; }

    .drop-zone p {
      font-size: 1.05em;
      margin-bottom: 12px;
    }

    .drop-zone button {
      padding: 12px 22px;
      background: linear-gradient(90deg, #f43f5e, #fb923c);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 10px 20px rgba(244, 63, 94, 0.25);
    }

    .drop-zone button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(251, 146, 60, 0.3);
    }

    .message {
      margin-top: 14px;
      font-size: 0.98em;
    }

    .message.error { color: #dc2626; }
    .message.success { color: #16a34a; }

    .email-option {
      margin-top: 28px;
      font-size: 1em;
      color: #4b5563;
      text-align: center;
      line-height: 1.6;
    }

    .email-option a {
      color: #f43f5e;
      font-weight: 600;
    }

    footer {
      margin-top: 38px;
      font-size: 0.95em;
      color: #6b7280;
      text-align: center;
      max-width: 820px;
    }

    footer .disclaimer {
      font-size: 0.85em;
      color: #9ca3af;
    }

    #progress-container {
      width: 100%;
      background-color: #f3f4f6;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      margin-top: 18px;
      height: 12px;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #22d3ee, #a855f7);
      transition: width 0.3s;
    }

    #fullscreen-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.78);
      display: none;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #e5e7eb;
    }

    .fullscreen-spinner {
      margin: 0 auto 18px auto;
      border: 8px solid #f9a8d4;
      border-top: 8px solid #38bdf8;
      border-radius: 50%;
      width: 76px;
      height: 76px;
      animation: spin 1s linear infinite;
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.4);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #fullscreen-tasks {
      color: #cbd5e1;
      font-size: 1em;
      height: 1em;
      margin-top: 10px;
      transition: opacity 0.3s;
    }

    @media (max-width: 640px) {
      .content { padding: 30px 22px; }
      header h1 { font-size: 2.4em; }
      .content h2 { font-size: 1.25em; }
    }
  </style>
</head>
<body>
  <header>
    <h1>邮件安全分析</h1>
    <p>快速检测钓鱼风险，保护你的收件箱</p>
  </header>

  <main class="content">
    <h2>开始上传并分析</h2>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".eml" />
      <p>拖拽 .eml 邮件到此处，或点击按钮选择文件</p>
      <button type="button" id="browse-button">选择 .eml 文件</button>
    </div>

    <div id="message" class="message"></div>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div class="email-option">
      也可以直接发送邮件至 <a href="mailto:start@mailcheck.help?subject=邮件分析&body=请将 .eml 文件作为附件发送，或直接转发原邮件。">start@mailcheck.help</a><br>
      我们会自动返回分析报告。<br>
      不会保存你的邮件内容，只用于本次分析。
    </div>
  </main>

  <footer>
    <p>© 2024 Mailcheck-Service. 保留所有权利。</p>
    <p class="disclaimer">本服务为 LMU München 学士论文项目，数据仅用于必要的安全分析。</p>
  </footer>

  <div id="fullscreen-loader">
    <div class="fullscreen-spinner"></div>
    <div id="fullscreen-tasks"></div>
  </div>

  <script>
    const tasks = [
      "检查邮件头 …",
      "验证发件人签名 …",
      "查询 DNS 记录 …",
      "核对认证标识 …",
      "匹配黑白名单 …",
      "检测钓鱼模式 …",
      "安全浏览隔离 …",
      "提取并打开链接 …",
      "扫描附件 …",
      "等待 AI 分析 …",
      "生成报告 …",
      "发送报告 …",
    ];

    function invokeProcessing(emlFile) {
      const formData = new FormData();
      formData.append('emlFile', emlFile);
      showFullscreenLoader();

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/analyze', true);

      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');

      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          const percentComplete = (event.loaded / event.total) * 100;
          progressBar.style.width = percentComplete + '%';
        }
      };

      xhr.onload = function () {
        progressContainer.style.display = 'none';
        hideFullscreenLoader();

        if (xhr.status === 200) {
          try {
            const response = JSON.parse(xhr.responseText);
            localStorage.setItem('emailReport', JSON.stringify(response));
            window.location.href = '/result';
          } catch (e) {
            displayMessage('服务器返回数据异常。', 'error');
          }
        } else {
          let errorMsg = '上传过程中出现错误。';
          try {
            const errorResponse = JSON.parse(xhr.responseText);
            if (errorResponse.error) {
              errorMsg = errorResponse.error;
            }
          } catch (e) {}
          displayMessage(errorMsg, 'error');
        }
      };

      xhr.onerror = function () {
        progressContainer.style.display = 'none';
        hideFullscreenLoader();
        displayMessage('网络出现问题，请稍后重试。', 'error');
      };

      xhr.send(formData);
    }

    function displayMessage(message, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = message;
      msgDiv.className = 'message ' + type;
    }

    function showFullscreenLoader() {
      const loader = document.getElementById('fullscreen-loader');
      loader.style.display = 'flex';

      const taskDiv = document.getElementById('fullscreen-tasks');
      let index = 0;
      taskDiv.textContent = tasks[index];

      const intervalId = setInterval(() => {
        index++;
        if (index >= tasks.length) {
          clearInterval(intervalId);
          taskDiv.textContent = "";
        } else {
          taskDiv.textContent = tasks[index];
        }
      }, 2300);
    }

    function hideFullscreenLoader() {
      document.getElementById('fullscreen-loader').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const browseButton = document.getElementById('browse-button');
      const message = document.getElementById('message');

      browseButton.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        handleFile(file);
        fileInput.value = '';
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('hover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('hover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        const file = e.dataTransfer.files[0];
        handleFile(file);
      });

      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      function handleFile(file) {
        message.textContent = '';
        message.classList.remove('error', 'success');
        if (!file) return;

        const validExtension = /\.eml$/i;
        const maxSize = 35 * 1024 * 1024;

        if (!validExtension.test(file.name)) {
          message.textContent = '仅支持 .eml 邮件文件。';
          message.classList.add('error');
          return;
        }

        if (file.size > maxSize) {
          message.textContent = '文件需小于 35MB。';
          message.classList.add('error');
          return;
        }

        displayMessage('文件已上传，正在分析…', 'success');
        invokeProcessing(file);
      }
    });
  </script>
</body>
</html>
