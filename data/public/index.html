<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮件安全分析</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #0b1021;
      --bg-end: #192447;
      --card: rgba(20, 24, 45, 0.7);
      --glass: rgba(255, 255, 255, 0.08);
      --accent: #7cf2ad;
      --accent-2: #7ab8ff;
      --text: #e8ecf3;
      --muted: #b7c4d8;
      --error: #ff7b9c;
      --success: #6ff0b7;
      --shadow: 0 18px 60px rgba(0,0,0,0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(124, 242, 173, 0.16), transparent 25%),
                  radial-gradient(circle at 80% 0%, rgba(122, 184, 255, 0.18), transparent 28%),
                  linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2.8em;
      margin-bottom: 10px;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    header p {
      font-size: 1.1em;
      color: var(--muted);
    }

    .content {
      background: var(--card);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 34px 28px;
      max-width: 640px;
      width: 100%;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .content h2 {
      font-size: 1.5em;
      margin-bottom: 18px;
      color: #ffffff;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .drop-zone {
      border: 1px dashed rgba(124, 242, 173, 0.55);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      background: var(--glass);
      color: var(--muted);
      position: relative;
    }

    .drop-zone.hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .drop-zone input {
      display: none;
    }

    .drop-zone p {
      font-size: 1.05em;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .drop-zone button {
      padding: 12px 22px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      color: #0b1224;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 12px 30px rgba(124, 242, 173, 0.35);
    }

    .drop-zone button:hover {
      transform: translateY(-1px) scale(1.01);
      box-shadow: 0 14px 36px rgba(122, 184, 255, 0.3);
    }

    .message {
      margin-top: 15px;
      font-size: 0.95em;
      min-height: 1.2em;
    }

    .message.error {
      color: var(--error);
    }

    .message.success {
      color: var(--success);
    }

    .email-option {
      margin-top: 28px;
      font-size: 1em;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .email-option a {
      color: var(--accent);
      text-decoration: underline;
      font-weight: 700;
    }

    .email-option a:hover {
      color: var(--accent-2);
    }

    footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: var(--muted);
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
    }

    footer .disclaimer {
      font-size: 0.85em;
      color: #8b96ad;
    }

    #progress-container {
      width: 100%;
      background-color: rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
      display: none;
      margin-top: 18px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #progress-bar {
      width: 0%;
      height: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.3s;
    }

    #fullscreen-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(6, 8, 18, 0.92);
      display: none;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #eaf4ff;
      padding: 20px;
    }

    .fullscreen-spinner {
      margin: 0 auto 20px auto;
      border: 8px solid rgba(255,255,255,0.18);
      border-top: 8px solid var(--accent);
      border-radius: 50%;
      width: 70px;
      height: 70px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #fullscreen-tasks {
      color: #d3ddf0;
      font-size: 1em;
      height: 1.2em;
      margin-top: 10px;
      transition: opacity 0.3s;
    }

    @media (max-width: 600px) {
      .content {
        padding: 28px 20px;
      }

      header h1 {
        font-size: 2.2em;
      }

      .content h2 {
        font-size: 1.25em;
      }

      #fullscreen-tasks {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>邮件安全分析</h1>
    <p>检查邮件是否存在钓鱼或其他安全风险</p>
  </header>

  <main class="content">
    <h2>立即上传 .eml 文件开始分析</h2>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".eml" />
      <p>将 .eml 文件拖拽到此处，或点击选择文件</p>
      <button type="button" id="browse-button">选择文件</button>
    </div>

    <div id="message" class="message"></div>

    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div class="email-option">
      或直接把邮件转发到
      <a href="mailto:start@mailcheck.help?subject=邮件分析&body=请将 .eml 文件作为附件发送，或直接转发邮件。">start@mailcheck.help</a>
      ，即可自动收到检测报告。
      <br>
      想了解如何获取 .eml 文件？请点击<a href="/how">这里查看指南</a>。
    </div>
  </main>

  <footer>
    <p>© 2024 Mailcheck 服务。保留所有权利。</p>
    <p class="disclaimer">
      本服务由慕尼黑路德维希-马克西米利安大学本科项目开发。
      <br>
      为完成分析，数据可能会转交给相关服务商。
    </p>
  </footer>

  <div id="fullscreen-loader">
    <div class="fullscreen-spinner"></div>
    <div id="fullscreen-tasks"></div>
  </div>

  <script>
    const tasks = [
      "正在检查邮件头部...",
      "验证发件人签名...",
      "查询 DNS 记录...",
      "核对身份验证头...",
      "比对黑名单/白名单...",
      "识别钓鱼特征...",
      "启动安全浏览器...",
      "访问链接并抓取...",
      "扫描附件...",
      "等待大模型分析...",
      "生成报告...",
      "接收结果...",
    ];

    function invokeProcessing(emlFile) {
      const formData = new FormData();
      formData.append('emlFile', emlFile);

      showFullscreenLoader();

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/analyze', true);

      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');

      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          const percentComplete = (event.loaded / event.total) * 100;
          progressBar.style.width = percentComplete + '%';
        }
      };

      xhr.onload = function () {
        progressContainer.style.display = 'none';
        hideFullscreenLoader();

        if (xhr.status === 200) {
          try {
            const response = JSON.parse(xhr.responseText);
            localStorage.setItem('emailReport', JSON.stringify(response));
            window.location.href = '/result';
          } catch (e) {
            displayMessage('处理服务器响应时出错。', 'error');
          }
        } else {
          let errorMsg = '上传文件时出现错误。';
          try {
            const errorResponse = JSON.parse(xhr.responseText);
            if (errorResponse.error) {
              errorMsg = errorResponse.error;
            }
          } catch (e) {}
          displayMessage(errorMsg, 'error');
        }
      };

      xhr.onerror = function () {
        progressContainer.style.display = 'none';
        hideFullscreenLoader();
        displayMessage('网络错误，请稍后重试。', 'error');
      };

      xhr.send(formData);
    }

    function displayMessage(message, type) {
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = message;
      msgDiv.className = 'message ' + type;
    }

    function showFullscreenLoader() {
      const loader = document.getElementById('fullscreen-loader');
      loader.style.display = 'flex';

      const taskDiv = document.getElementById('fullscreen-tasks');
      let index = 0;
      taskDiv.textContent = tasks[index];

      const intervalId = setInterval(() => {
        index++;
        if (index >= tasks.length) {
          clearInterval(intervalId);
          taskDiv.textContent = '';
        } else {
          taskDiv.textContent = tasks[index];
        }
      }, 2500);
    }

    function hideFullscreenLoader() {
      document.getElementById('fullscreen-loader').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const browseButton = document.getElementById('browse-button');
      const message = document.getElementById('message');

      browseButton.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        fileInput.click();
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        handleFile(file);
        fileInput.value = '';
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('hover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('hover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        const file = e.dataTransfer.files[0];
        handleFile(file);
      });

      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      function handleFile(file) {
        message.textContent = '';
        message.classList.remove('error', 'success');

        if (!file) return;

        const validExtension = /\.eml$/i;
        const maxSize = 35 * 1024 * 1024;

        if (!validExtension.test(file.name)) {
          message.textContent = '错误：仅支持 .eml 文件。';
          message.classList.add('error');
          return;
        }

        if (file.size > maxSize) {
          message.textContent = '错误：文件大小不得超过 35MB。';
          message.classList.add('error');
          return;
        }

        displayMessage('文件已上传，正在安全分析...', 'success');
        invokeProcessing(file);
      }
    });
  </script>
</body>
</html>
